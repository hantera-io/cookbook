id: commerce-kustom-nshift-checkout
name: Commerce + Kustom + nShift Checkout (template)
description: >-
  App template that exposes the Kustom Shipping Assistant (KSA) callback API
  backed by nShift Checkout, for a Hantera Commerce cart paid via Kustom
  Payments. Copy, rename, and customize.
authors:
  - Your Company

# === App settings ===
# KSA's /auth handshake uses a merchant identifier and a shared key. KSS sends
# `sha256(nonce + key)` and we validate against the configured key.
settings:
  identifier:
    type: text
    description: >-
      Merchant identifier configured on the Kustom side. KSS sends this in the
      /auth request body; we accept the handshake only if it matches.
  key:
    type: text
    description: >-
      Shared secret matched with the identifier. Used both to verify the SHA-256
      digest in the /auth handshake and to sign and verify the bearer JWT.

# === Cross-app module dependency ===
# This template consumes the public nShift module. The consumer MUST declare the
# module and the export types it uses; the declaration is type-checked against
# nShift's real source at activation. Keep this type string in sync with the
# nShift app's `getOptions` export.
requires:
  graph:
    nodes:
      ticket.cart:
        fields:
          # kustomOrderId is provided by apps.psp.kustom's registryEntries,
          # which surfaces `dynamic.field:kustomOrderId` as a typed graph
          # field. Used by helpers/cart-resolution.module.hrc to look up the
          # cart from KSA's `order.id`.
          kustomOrderId: { type: text }
      ticket.nShiftCheckoutSession:
        fields: {}
    sets:
      carts: { node: ticket.cart }
      nShiftCheckoutSessions: { node: ticket.nShiftCheckoutSession }
  modules:
    /apps/nshift-checkout/nshift.module.hrc:
      exports:
        getOptions:
          type: >-
            (sessionActorId: uuid | nothing, request: {
              totalPrice: number, totalVolumeCm3: number, totalWeightKg: number,
              localeId: text, currencyCode: text, languageCode: text,
              packages: [value], variables: { text -> value },
              receiver: {
                name: text,address1: text, postalCode: text,
                city: text, country: text, phone: text | nothing,
                email: text | nothing
              }
            }) => {
              sessionActorId: uuid,
              options: [{
                optionId: text, sessionActorId: uuid,
                shippingProductNumber: text, carrierId: text,
                carrierProductId: text, name: text, title: text | nothing,
                price: number, originalPrice: number | nothing,
                taxRate: number | nothing, priceDescription: text | nothing,
                logoUrl: text | nothing, texts: [text] | nothing,
                valid: bool | nothing,
                additionalValues: { text -> value } | nothing,
                pickupPoints: [value] | nothing, raw: { text -> value }
              }]
            } | { error: { code: text, message: text, details: value } }

components:
  - id: helpers/auth.module.hrc
  - id: helpers/cart-resolution.module.hrc
  - id: helpers/mapping.module.hrc
  - id: ingresses/auth.hrc
  - id: ingresses/shippingoptions.hrc
  - id: ingresses/postshipment.hrc
  - id: ingresses/getshipment.hrc
  - id: ingresses/putshipment.hrc

ingresses:
  # KSA: POST /auth — TMS handshake (sha256(nonce+key) → bearer JWT)
  - id: auth
    componentId: ingresses/auth.hrc
    acl:
      - registry/apps/commerce-kustom-nshift-checkout:read
    type: http
    properties:
      route: /kustom/nshift/auth
      httpMethod: POST
      body:
        mode: raw
        parameter: body
      isPublic: true

  # KSA: POST /shippingoptions — return shipping options for the cart
  #
  # `actors/ticket:create` is required because the nshift-checkout module's
  # getOptions creates an `nShiftCheckoutSession` ticket actor the first time
  # it's called for a cart. Without it, the create is rejected with
  # UNAUTHORIZED_MESSAGE and the cart ends up pointing at a non-existent
  # session.
  - id: shippingoptions
    componentId: ingresses/shippingoptions.hrc
    acl:
      - actors/ticket:complete
      - actors/ticket:query
      - actors/ticket:applyCommands
      - actors/ticket:create
      - graph/ticket.cart:*
      - graph/order:*
      - graph/delivery:*
      - graph/orderLine:*
      - graph/ticket.nShiftCheckoutSession:*
      - registry/channels:read
      - registry/apps/commerce:read
      - registry/apps/commerce-kustom-nshift-checkout:read
      # nShift module reads settings + the cached token, and writes the token.
      - registry/apps/nshift-checkout:read
      - registry/apps/nshift-checkout:write
    type: http
    properties:
      route: /kustom/nshift/shippingoptions
      httpMethod: POST
      headers: {
        authorization: Authorization
      }
      body:
        mode: raw
        parameter: body
      isPublic: true

  # KSA: POST /shipment — reserve the shopper's selected option onto the cart
  - id: postshipment
    componentId: ingresses/postshipment.hrc
    acl:
      - actors/ticket:applyCommands
      - actors/ticket:query
      - graph/ticket.cart:*
      - graph/ticket.nShiftCheckoutSession:*
      - registry/apps/commerce:read
      - registry/apps/commerce-kustom-nshift-checkout:read
    type: http
    properties:
      route: /kustom/nshift/shipment
      httpMethod: POST
      headers: {
        authorization: Authorization
      }
      body:
        mode: raw
        parameter: body
      isPublic: true

  # KSA: GET /shipment/{shipment_id} — current shipment status
  - id: getshipment
    componentId: ingresses/getshipment.hrc
    acl:
      - actors/ticket:query
      - graph/ticket.nShiftCheckoutSession:*
      - registry/apps/commerce-kustom-nshift-checkout:read
    type: http
    properties:
      route: /kustom/nshift/shipment/{sessionActorId}
      httpMethod: GET
      headers: {
        authorization: Authorization
      }
      isPublic: true

  # KSA: PUT /shipment/{shipment_id} — update the previously reserved shipment
  - id: putshipment
    componentId: ingresses/putshipment.hrc
    acl:
      - actors/ticket:applyCommands
      - actors/ticket:query
      - graph/ticket.cart:*
      - graph/ticket.nShiftCheckoutSession:*
      - registry/apps/commerce:read
      - registry/apps/commerce-kustom-nshift-checkout:read
    type: http
    properties:
      route: /kustom/nshift/shipment/{sessionActorId}
      httpMethod: PUT
      headers: {
        authorization: Authorization
      }
      body:
        mode: raw
        parameter: body
      isPublic: true
